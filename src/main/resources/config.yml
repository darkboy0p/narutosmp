# ShinobiSMP configuration
seal-mode:
  enabled: true
  seal-timeout-ms: 3000      # max gap between two seals before the sequence resets
  idle-exit-ms: 15000        # seal mode closes itself after this much inactivity

chakra:
  base-max: 100.0
  max-cap: 400.0
  base-regen: 2.0            # per second
  meditation-multiplier: 3.0 # sneak and stand still
  meditation-growth: 0.05    # max chakra gained per second of meditation
  dojutsu-upkeep: 2.0        # per second while a dojutsu is active

pvp: true                    # false = jutsu never hurt other players

starter-jutsu:
  - substitution

# Chance (0-1) per clan, rolled once on a player's first join. Most players get none.
clans:
  roll-chance:
    uchiha: 0.06
    hyuga: 0.06
    uzumaki: 0.05
    senju: 0.05
    nara: 0.07

awakening:
  near-death-health: 4.0     # a clan member awakens when pushed to this health or lower

bond:
  mangekyo-witness-range: 40.0

mangekyo:
  max-powers-per-player: 1      # 1 = original behaviour (one unique power each). Raise it to let a Uchiha hold e.g. Susanoo AND Amaterasu.
  owner-death: return        # return | transfer | keep

gates:
  min-health-to-open: 12.0
  death-gate-lethal: false   # true = Gate of Death kills, like canon

# Easy mode (true = easier). Set any of these to false for the harder, scroll-and-nature progression.
easy-mode:
  unlock-all-jutsu: true     # every technique is usable without finding its scroll
  ignore-nature: true        # chakra nature never blocks a technique
  quick-cast: true           # click a technique in /jutsu (or /shinobi > Jutsu Book) or use /jutsu cast <id> instead of seals

scrolls:
  craftable: true            # every technique scroll can be crafted: Blank Scroll + Ink Sac + 2x a catalyst (/jutsu info shows it). Needs a restart to change.

# Override any jutsu's hand seals here (seal names: rat ox tiger hare dragon snake horse ram monkey bird dog boar).
# Defaults are in code; the Substitution default is NOT verified against canon - edit freely.
jutsu-seals: {}
#  substitution: [ram, boar, ox, dog, snake]

# ---- extra systems ----
block-damage: false          # explosive tags may break blocks if true (earth/water walls are always temporary)

sharingan:
  dodge-chance: 0.20
  copy-minutes: 10           # how long a copied jutsu lasts
  copy-range: 25.0
  # Active directional dodge (Uchiha with Sharingan active). A short dash plus a brief, capped damage-avoidance window.
  # Hard caps in code: window <= 10 ticks, cooldown >= 8x the window (so at most 12.5% uptime), distance <= 8 blocks.
  dodge:
    enabled: true
    double-sneak: true            # tap sneak twice quickly. Other ways: bind "sharingan_dodge" to a slot, or use the jutsu book.
    double-tap-window-ms: 300
    base-chakra-cost: 8.0         # read at startup
    movement-sample-ms: 350       # how recent your movement must be to pick the direction; otherwise you dodge backwards
    avoid-causes: [ENTITY_ATTACK, ENTITY_SWEEP_ATTACK, PROJECTILE]   # explosions, magic, lightning, fire, falls and void still hurt
    tiers:                        # per evolution stage; omitted keys keep the defaults
      tomoe1: {cooldown-ticks: 100, iframe-ticks: 3, distance: 3.0, cost-multiplier: 1.0}
      tomoe2: {cooldown-ticks: 90, iframe-ticks: 4, distance: 3.5, cost-multiplier: 1.0}
      tomoe3: {cooldown-ticks: 80, iframe-ticks: 5, distance: 4.0, cost-multiplier: 1.0}
      mangekyo: {cooldown-ticks: 70, iframe-ticks: 5, distance: 4.5, cost-multiplier: 1.0}
      eternal: {cooldown-ticks: 60, iframe-ticks: 5, distance: 4.5, cost-multiplier: 0.7}

loot:
  scroll-chance: 0.10        # chance a generated loot chest also contains a random jutsu scroll
  gear-chance: 0.15          # chance it contains a few kunai or shuriken

hud:
  enabled: true

# Optional resource pack (custom item textures + HUD glyphs). Leave disabled unless the pack is installed,
# otherwise custom items show as missing-model cubes.
resource-pack:
  enabled: false
  url: ""
  sha1: ""
  force: false

# ---- Stage 1: ability framework and temporary blocks ----
abilities:
  max-active-effects-per-player: 24   # cap on tracked temporary effects per player (EffectRegistry)
  disabled-worlds: []                 # world names where no jutsu can be cast, e.g. ["spawn"]

temp-blocks:
  max-total: 2000        # server-wide cap on simultaneous temporary blocks
  max-seconds: 300       # no temporary block may live longer than this

# ---- Stage 2: chargeable techniques (Paper 1.21.11) ----
# Controls are server-side only: a charge starts from the normal seal combo (or quick-cast), then is released or cancelled
# with one of the triggers below. Paper cannot read arbitrary keyboard keys.
charging:
  enabled: true                  # false = every jutsu uses its instant version (Rasenshuriken needs charging)
  release-triggers: [SWING]      # SWING (left-click / arm swing), SWAP_HAND (F key), SNEAK
  cancel-triggers: [SNEAK]       # same values; a trigger cannot be in both lists
  tick-interval: 2               # ticks between charge updates (1-5)
  overcharge-action: RELEASE     # what happens when a full charge is held too long: RELEASE or CANCEL
  interrupt-damage-threshold: 4.0 # a hit of at least this much damage interrupts a charge; -1 disables
  cancel-cooldown-ms: 1500       # short lockout after a cancelled/fizzled/interrupted charge (anti-spam)
  # Fraction of the reserved chakra returned when a charge ends without firing.
  refund:
    cancelled: 0.5               # player cancelled
    fizzled: 0.5                 # released before the minimum charge
    failed-release: 0.5          # released but nothing valid to hit
    interrupted: 0.0             # damage, inventory opened, teleport, game-mode change
    forced: 0.0                  # death, quit, world change, shutdown, admin clear
  visuals:
    enabled: true
    particle-density: 1.0        # 0 = none, 1 = default, 2 = max
    session-budget: 12           # above this many simultaneous charges, particles per charge shrink
    sounds: true
    sound-volume: 1.0
    orb: true                    # spinning 3D chakra orb at the hand while charging (needs the resource pack)
  feedback:
    actionbar: true
  # Per-technique overrides (any key may be omitted). Times are server ticks (20 = 1 second).
  # min-ticks/max-ticks, stages (2-6), hold-limit-ticks, grace-ticks, slowness (-1 = none, 0 = Slowness I ...),
  # cancellable, early-release (FIZZLE|IGNORE), min-scale/max-scale (damage), range-min-scale/range-max-scale, enabled.
  jutsu:
    chidori:
      min-ticks: 30
      max-ticks: 70
      damage: 14.0
      dash-speed: 1.6
      max-dash-speed: 2.4
      dash-ticks: 12
    rasengan:
      min-ticks: 20
      max-ticks: 50
      damage: 12.0
      reach: 3.5
    rasenshuriken:
      min-ticks: 50
      max-ticks: 100
      damage: 18.0
      radius: 3.5
      max-radius: 5.0
      speed: 1.1
      projectile-ticks: 30
      requires-rasengan-casts: 30   # progression gate (read at startup)
    great_fireball:
      min-ticks: 15
      max-ticks: 45
      damage: 8.0
      range-steps: 22

# ---- Stage 3: clan bloodlines (kekkei genkai) ----
# Every cast and every dojutsu activation is checked server-side against these rules (commands, GUI, quick-cast and saved
# slots all go through the same check). Values here override the built-in defaults; omit a key to keep the default.
#   enabled        : false = nobody can use it (all rare bloodlines ship disabled)
#   eligible-clans : clans that may hold it. [] = nobody, unless any-clan is true
#   any-clan       : owner exception: any clan may hold it (still needs an unlock + awakening)
#   innate         : granted automatically to eligible awakened clan members
#   parent         : earlier stage that must be usable first (evolution chain)
#   rarity         : COMMON, UNCOMMON, RARE, EPIC, LEGENDARY
# Rare-bloodline clan lists below are suggestions chosen for this server, not canon claims; change them freely.
# Rare bloodlines are granted with: /shinobi admin bloodline <player> grant <id>. Abilities for them arrive in later groups.
bloodlines:
  sharingan:
    enabled: true
    rarity: RARE
    eligible-clans: [UCHIHA]
    any-clan: false
    innate: true
    parent: ""
  mangekyo_sharingan:
