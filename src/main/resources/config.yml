# ---- Admin override system ----
# Permissions: shinobismp.admin (grants all of the nodes below), .clan, .bloodline, .abilities, .progression, .chakra, .cooldowns,
# .data, .reload, .audit. The legacy node shinobi.admin (op) grants shinobismp.admin. See docs/ADMIN_COMMANDS.md.
admin:
  forced-grants-enabled: true            # false = stored forced grants are ignored (never erased)
  forced-abilities-require-chakra: true  # false = a forced ability costs no chakra (not recommended)
  forced-abilities-respect-cooldowns: true
  allow-offline-edits: false             # true = bloodline/ability commands may target offline players that already have a profile
  require-confirmation: true             # destructive 'clear' commands need the word 'confirm'
  audit:
    enabled: true
    max-bytes: 1000000                   # rotate audit.jsonl at this size
    keep-files: 10                       # rotated files kept

# ---- Susanoo ----
susanoo:
  drain-per-stage: 4.0          # chakra per second = this x stage. Higher stages cost more, never less.
  # Abilities refused WHILE Susanoo is active. Everything not listed keeps working inside Susanoo (fire techniques, Amaterasu,
  # Tsukuyomi, Chidori, Rasengan, dodge ...), each with its own chakra cost, cooldown and unlock. Default: only Kamui (self-phase).
  incompatible-abilities: [kamui]

# ---- Headband / dojutsu eyes as worn cosmetic gear (works with any helmet) ----
headgear:
  enabled: true                # needs resource-pack.enabled: true (the models come from the pack)
  update-ticks: 2              # how often the display is moved to the head (1-10)
  show-to-owner: false         # false = hidden from your own first-person view (other players still see it)
  model-yaw-offset: 180        # degrees. If the band appears backwards in game, change this (try 0).
