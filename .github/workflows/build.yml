name: Build ShinobiSMP

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to attach files to a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build plugin jar
        run: gradle build --no-daemon

      - name: Run logic tests
        run: gradle logicTests --no-daemon

      - name: Build resource pack
        run: python3 tools/make_pack.py

      - name: Verify resource pack references
        run: python3 tools/verify_pack.py

      - name: Show resource pack SHA-1
        run: |
          SHA=$(sha1sum ShinobiPack.zip | cut -d' ' -f1)
          echo "ShinobiPack.zip sha1: $SHA"
          echo "### ShinobiPack.zip SHA-1" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: ShinobiSMP-plugin
          path: build/libs/*.jar

      - name: Upload resource pack
        uses: actions/upload-artifact@v4
        with:
          name: ShinobiPack
          path: ShinobiPack.zip

      - name: Attach to release (only when you push a tag like v0.3.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
            ShinobiPack.zip
